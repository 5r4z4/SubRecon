name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: bash -n subdomreco.sh my_script.sh scripts/install.sh tests/test_cli.sh

      - name: Run ShellCheck
        run: shellcheck subdomreco.sh my_script.sh scripts/install.sh tests/test_cli.sh

      - name: Run CLI tests
        run: bash tests/test_cli.sh
